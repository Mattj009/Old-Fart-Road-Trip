<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#2b160d">
  <title>The Desert Divas • Old Fart Travel</title>
  <style>
    *{box-sizing:border-box} body{margin:0;background:#20130c;color:#f6e7c3;font-family:Arial,Helvetica,sans-serif}
    main{width:min(900px,calc(100% - 24px));margin:20px auto 80px}
    .poster,.video-panel{padding:12px;border:3px solid #b9893c;border-radius:18px;background:#120b07;box-shadow:0 10px 26px rgba(0,0,0,.4)}
    .poster img{display:block;width:100%;height:auto;border-radius:12px}
    .video-panel{margin-top:20px;text-align:center;padding:18px}
    h1{margin:0 0 8px;color:#e3bd69;font-family:Georgia,serif}
    p{line-height:1.5} video{display:block;width:100%;max-height:72vh;margin:14px auto 0;border-radius:12px;background:#000}
    .back{display:inline-block;margin-top:20px;padding:12px 18px;border-radius:999px;background:#7a1111;color:#fff;text-decoration:none;font-weight:900}
  </style>
</head>
<body>
  <main>
    <section class="poster">
      <button id="playPoster" type="button" aria-label="Play the Desert Divas video" style="all:unset;display:block;width:100%;cursor:pointer;">
        <img src="assets/wanted-poster.png" alt="Wanted poster for Joan and Robin, the Desert Divas">
      </button>
    </section>
    <section class="video-panel">
      <h1>The Desert Divas</h1>
      <p>They didn’t get far… but it was fun trying.</p>
      <video id="desertDivasVideo" controls playsinline preload="metadata">
        <source src="assets/videos/robin-joanie.mp4" type="video/mp4">
        Your browser cannot play this video.
      </video>
      <a class="back" href="vault.html">Return to the Vault</a>
    </section>
  </main>
  <script>
    const posterButton = document.getElementById('playPoster');
    const video = document.getElementById('desertDivasVideo');

    posterButton.addEventListener('click', async () => {
      video.scrollIntoView({ behavior: 'smooth', block: 'center' });
      try {
        await video.play();
      } catch (error) {
        // Some browsers may still require tapping the video's own play control.
      }
    });
  </script>
</body>
</html>
