<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#24150d">
  <title>Wanted: Joan & Robin</title>
  <style>
    :root {
      color-scheme: dark;
      --paper: #d8b979;
      --ink: #f8ead0;
      --red: #7b1d12;
      --panel: rgba(18, 10, 6, 0.92);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at top, rgba(118, 70, 31, 0.24), transparent 38rem),
        #120b07;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
    }

    body {
      display: flex;
      justify-content: center;
      padding: 14px 12px calc(24px + env(safe-area-inset-bottom));
    }

    main {
      width: min(100%, 760px);
    }

    .stage {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(216, 185, 121, 0.46);
      border-radius: 14px;
      background: #000;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.52);
    }

    .poster-button {
      display: block;
      width: 100%;
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    .poster-button img {
      display: block;
      width: 100%;
      height: auto;
    }

    .poster-button:focus-visible {
      outline: 4px solid var(--paper);
      outline-offset: -5px;
    }

    .video-wrap {
      display: none;
      background: #000;
    }

    .video-wrap.active {
      display: block;
    }

    video {
      display: block;
      width: 100%;
      height: auto;
      max-height: 78vh;
      background: #000;
    }

    .video-note {
      margin: 0;
      padding: 12px 16px 14px;
      color: #e8d7b8;
      background: var(--panel);
      text-align: center;
      font-size: 0.95rem;
    }

    .nav {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .nav a,
    .nav button {
      appearance: none;
      border: 1px solid rgba(216, 185, 121, 0.55);
      border-radius: 999px;
      padding: 11px 18px;
      background: #2b180e;
      color: var(--ink);
      font: 700 1rem/1 Georgia, "Times New Roman", serif;
      text-decoration: none;
      cursor: pointer;
    }

    .nav a:hover,
    .nav button:hover,
    .nav a:focus-visible,
    .nav button:focus-visible {
      background: var(--red);
      outline: none;
    }

    #showPoster {
      display: none;
    }

    #showPoster.visible {
      display: inline-block;
    }
  </style>
</head>
<body>
  <main>
    <section class="stage" aria-label="Wanted poster and video">
      <button class="poster-button" id="posterButton" type="button" aria-label="Play the Joan and Robin video">
        <img src="assets/wanted-poster.png" alt="Wanted poster for Joan and Robin, the Desert Divas">
      </button>

      <div class="video-wrap" id="videoWrap">
        <video id="wantedVideo" controls playsinline preload="metadata">
          <source src="assets/robin-joanie.mp4" type="video/mp4">
          Your browser cannot play this video.
        </video>
        <p class="video-note">They didn’t get far… but it was fun trying.</p>
      </div>
    </section>

    <nav class="nav" aria-label="Bonus feature navigation">
      <button id="showPoster" type="button">Show Poster Again</button>
      <a href="vault.html">← Back to the Vault</a>
    </nav>
  </main>

  <script>
    const posterButton = document.getElementById('posterButton');
    const videoWrap = document.getElementById('videoWrap');
    const video = document.getElementById('wantedVideo');
    const showPoster = document.getElementById('showPoster');

    function playVideo() {
      posterButton.hidden = true;
      videoWrap.classList.add('active');
      showPoster.classList.add('visible');
      video.currentTime = 0;
      const playAttempt = video.play();
      if (playAttempt && typeof playAttempt.catch === 'function') {
        playAttempt.catch(() => {
          // Controls remain available if the browser blocks automatic playback.
        });
      }
    }

    function restorePoster() {
      video.pause();
      videoWrap.classList.remove('active');
      posterButton.hidden = false;
      showPoster.classList.remove('visible');
      posterButton.focus();
    }

    posterButton.addEventListener('click', playVideo);
    showPoster.addEventListener('click', restorePoster);
  </script>
</body>
</html>
